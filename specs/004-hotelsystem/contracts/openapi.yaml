        - category
        - employeeId
        - employeeName
        - quantity
        - unitPrice
        - totalAmount
        - saleDate
        - status
        - demoData
        - createdAt
        - updatedAt
        - cancelledAt
      properties:
        id:
          type: integer
        drinkId:
          type: integer
        drinkName:
          type: string
        category:
          $ref: "#/components/schemas/DrinkCategory"
        employeeId:
          type: integer
        employeeName:
          type: string
        quantity:
          type: integer
        unitPrice:
          $ref: "#/components/schemas/Money"
        totalAmount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Antal gange enhedspris.
        saleDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/ResourceStatus"
        demoData:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
    BarSalePage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BarSale"
        total:
          type: integer
          description: Antal matchende poster i alt, uanset `offset` og `limit`.
    Catalogs:
      type: object
      required: [countries, roomTypes, employees, drinks]
      properties:
        countries:
          type: array
          items:
            type: object
            required: [id, code, name]
            properties:
              id:
                type: integer
              code:
                type: string
                description: ISO-landekode.
              name:
                type: string
        roomTypes:
          type: array
          items:
            type: object
            required: [id, code, name, roomCount, maxGuests, demoData, suggestedNightlyRates]
            properties:
              id:
                type: integer
              code:
                type: string
              name:
                type: string
              roomCount:
                type: integer
              maxGuests:
                type: integer
              demoData:
                type: boolean
                description: Kapaciteten er konstruerede demostamdata, ikke hotellets faktiske fordeling.
              suggestedNightlyRates:
                type: object
                description: Vejledende priser. En booking gemmer sin egen aftalte natpris.
                required: [low, mid, high]
                properties:
                  low:
                    $ref: "#/components/schemas/Money"
                  mid:
                    $ref: "#/components/schemas/Money"
                  high:
                    $ref: "#/components/schemas/Money"
        employees:
          type: array
          items:
            type: object
            required: [id, code, name]
            properties:
              id:
                type: integer
              code:
                type: string
              name:
                type: string
        drinks:
          type: array
          items:
            type: object
            required: [id, name, category, suggestedUnitPrice]
            properties:
              id:
                type: integer
              name:
                type: string
              category:
                $ref: "#/components/schemas/DrinkCategory"
              suggestedUnitPrice:
                $ref: "#/components/schemas/Money"
    HotelPeriodTotals:
      type: object
      required:
        - revenue
