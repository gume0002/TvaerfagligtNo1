                type: integer
              countryName:
                type: string
              guestStays:
                type: integer
        topRoomTypes:
          type: array
          description: Fuld rangliste efter omsætning. Lige beløb får samme `rank`, så alle delte førstepladser har `rank` 1. Næste placering springer de delte pladser over, fx 1, 1, 3.
          items:
            type: object
            required: [rank, roomTypeId, roomTypeName, revenue]
            properties:
              rank:
                type: integer
              roomTypeId:
                type: integer
              roomTypeName:
                type: string
              revenue:
                $ref: "#/components/schemas/Money"
        topCountries:
          type: array
          description: Fuld rangliste efter omsætning. Lige beløb får samme `rank`, så alle delte førstepladser har `rank` 1. Næste placering springer de delte pladser over, fx 1, 1, 3.
          items:
            type: object
            required: [rank, countryId, countryName, revenue]
            properties:
              rank:
                type: integer
              countryId:
                type: integer
              countryName:
                type: string
              revenue:
                $ref: "#/components/schemas/Money"
        satisfaction:
          type: object
          description: Der findes ingen vurderinger, så der leveres ingen score.
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [no_data]
    BarAnalytics:
      type: object
      required: [filters, generatedAt, businessDate, demoData, totals, byDrink, byCategory]
      properties:
        filters:
          type: object
          required: [year, employeeId, employeeName]
          properties:
