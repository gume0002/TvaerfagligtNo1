        bookedRoomNights:
          type: integer
        availableRoomNights:
          type: integer
        occupancyRatePercent:
          type: string
          nullable: true
          pattern: '^\d+\.\d{2}$'
          description: Bookede værelsesnætter divideret med tilgængelige værelsesnætter gange 100.
        occupancyStatus:
          $ref: "#/components/schemas/DataStatus"
        adr:
          type: string
          nullable: true
          pattern: '^\d+\.\d{2}$'
          description: Omsætning divideret med bookede værelsesnætter.
        adrStatus:
          $ref: "#/components/schemas/DataStatus"
    HotelAnalytics:
      type: object
      required:
        - filters
        - generatedAt
        - businessDate
        - demoData
        - occupancyScope
        - totals
        - byRoomTypeAndSeason
        - byCountry
        - guestStaysByCountry
        - topRoomTypes
        - topCountries
        - satisfaction
      properties:
        filters:
          type: object
          required: [year, season, countryId, roomTypeId]
          properties:
            year:
              type: integer
            season:
              type: string
              nullable: true
              enum: [low, mid, high, null]
            countryId:
              type: integer
              nullable: true
            roomTypeId:
              type: integer
              nullable: true
        generatedAt:
          type: string
          format: date-time
          description: Tidspunktet for datagrundlaget.
        businessDate:
          type: string
          format: date
          description: Hotellets dags dato, som adskiller `past` og `upcoming`.
        demoData:
          type: boolean
          description: Sand, hvis resultatet indeholder demodata.
        occupancyScope:
          type: string
          description: "`country_contribution` betyder, at belægningen er landets bidrag til hotellets kapacitet."
          enum: [hotel, country_contribution]
        totals:
          type: object
          required: [past, upcoming, all]
          properties:
            past:
              $ref: "#/components/schemas/HotelPeriodTotals"
            upcoming:
              $ref: "#/components/schemas/HotelPeriodTotals"
            all:
              $ref: "#/components/schemas/HotelPeriodTotals"
        byRoomTypeAndSeason:
          type: array
          items:
            type: object
            required: [roomTypeId, roomTypeName, season, revenue]
            properties:
              roomTypeId:
                type: integer
              roomTypeName:
                type: string
              season:
                $ref: "#/components/schemas/Season"
              revenue:
                $ref: "#/components/schemas/Money"
        byCountry:
