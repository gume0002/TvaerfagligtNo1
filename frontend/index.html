<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Kong Arthur – Bookinger</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="page-header">
    <h1>Hotel Kong Arthur</h1>
    <p>Bookinger</p>
  </header>

  <main>
    <div id="global-message" class="message" role="status" hidden></div>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Opret booking</h2>
      <form id="booking-form" novalidate>
        <div class="field wide">
          <label for="guestName">Gæstens navn</label>
          <input id="guestName" name="guestName" type="text" maxlength="200" autocomplete="off" required>
          <p class="field-error" data-error-for="guestName"></p>
        </div>
        <div class="field">
          <label for="countryId">Land</label>
          <select id="countryId" name="countryId" required></select>
          <p class="field-error" data-error-for="countryId"></p>
        </div>
        <div class="field">
          <label for="roomTypeId">Værelsestype</label>
          <select id="roomTypeId" name="roomTypeId" required></select>
          <p class="hint" id="room-type-hint"></p>
          <p class="field-error" data-error-for="roomTypeId"></p>
        </div>
        <div class="field">
          <label for="arrival">Ankomst</label>
          <input id="arrival" name="arrival" type="date" required>
          <p class="field-error" data-error-for="arrival"></p>
        </div>
        <div class="field">
          <label for="departure">Afrejse</label>
          <input id="departure" name="departure" type="date" required>
          <p class="field-error" data-error-for="departure"></p>
        </div>
        <div class="field">
          <label for="guestCount">Antal gæster</label>
          <input id="guestCount" name="guestCount" type="number" min="1" step="1" required>
          <p class="field-error" data-error-for="guestCount"></p>
        </div>
        <div class="field">
          <label for="nightlyRate">Aftalt pris pr. nat (DKK)</label>
          <input id="nightlyRate" name="nightlyRate" type="text" inputmode="decimal" placeholder="1000.00" autocomplete="off" required>
          <p class="field-error" data-error-for="nightlyRate"></p>
        </div>
        <div class="actions wide">
          <button id="save-button" type="submit" class="primary">Opret booking</button>
          <button id="cancel-edit-button" type="button" hidden>Annullér rettelse</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <h2 id="list-title">Find booking</h2>
      <form id="search-form" class="filters">
        <div class="field">
          <label for="search-name">Navn</label>
          <input id="search-name" type="search" autocomplete="off">
        </div>
        <div class="field">
          <label for="search-from">Ophold fra</label>
          <input id="search-from" type="date">
        </div>
        <div class="field">
          <label for="search-to">Ophold til</label>
          <input id="search-to" type="date">
        </div>
        <div class="field">
          <label for="search-status">Vis</label>
          <select id="search-status">
            <option value="active">Aktive</option>
            <option value="cancelled">Aflyste (historik)</option>
            <option value="all">Alle</option>
          </select>
        </div>
        <div class="actions">
          <button type="submit" class="primary">Søg</button>
          <button id="clear-search" type="button">Nulstil</button>
        </div>
      </form>
      <div id="search-message" class="message error" role="alert" hidden></div>

      <p id="result-count" class="result-count" aria-live="polite"></p>
      <div class="table-wrap">
        <table id="booking-table">
          <thead>
            <tr>
              <th scope="col">Nr.</th>
              <th scope="col">Gæst</th>
              <th scope="col">Land</th>
              <th scope="col">Værelsestype</th>
              <th scope="col">Ankomst</th>
              <th scope="col">Afrejse</th>
              <th scope="col" class="number">Gæster</th>
              <th scope="col" class="number">Pris pr. nat</th>
              <th scope="col">Status</th>
              <th scope="col"><span class="visually-hidden">Handlinger</span></th>
            </tr>
          </thead>
          <tbody id="booking-rows"></tbody>
        </table>
      </div>
      <p id="empty-state" class="empty-state" hidden>Ingen bookinger matcher søgningen.</p>
      <div class="pagination">
        <button id="previous-page" type="button" disabled>Forrige</button>
        <button id="next-page" type="button" disabled>Næste</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
