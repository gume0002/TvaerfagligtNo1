<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Kong Arthur – Analyser</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="page-header">
    <h1>Hotel Kong Arthur</h1>
    <p>Analyser</p>
    <nav><a href="/">Bookinger</a> · <a href="sales.html">Barsalg</a></nav>
  </header>

  <main class="viz-root">
    <div id="analytics-error" class="message error" role="alert" hidden></div>

    <section class="panel" aria-labelledby="filter-title">
      <h2 id="filter-title">Vælg data</h2>
      <form id="analytics-filters" class="filters">
        <div class="field"><label for="filter-year">År</label><select id="filter-year"></select></div>
        <div class="field">
          <label for="filter-season">Sæson</label>
          <select id="filter-season">
            <option value="">Alle</option>
            <option value="low">Lavsæson</option>
            <option value="mid">Mellemsæson</option>
            <option value="high">Højsæson</option>
          </select>
        </div>
        <div class="field"><label for="filter-country">Land</label><select id="filter-country"></select></div>
        <div class="field"><label for="filter-room-type">Værelsestype</label><select id="filter-room-type"></select></div>
        <div class="field"><label for="filter-employee">Medarbejder (bar)</label><select id="filter-employee"></select></div>
      </form>
      <p id="data-status" class="result-count" aria-live="polite"></p>
    </section>

    <div id="analytics-content" hidden>
      <section class="panel" aria-labelledby="hotel-title">
        <h2 id="hotel-title">Hotellet</h2>
        <div id="hotel-tiles" class="tiles"></div>
        <details class="data-table">
          <summary>Vis perioder som tabel</summary>
          <div class="table-wrap"><table id="hotel-periods"></table></div>
        </details>

        <div class="charts">
          <figure class="chart">
            <figcaption>Omsætning pr. værelsestype og sæson (rangliste)</figcaption>
            <div id="season-legend" class="legend"></div>
            <div id="chart-room-types"></div>
            <details class="data-table"><summary>Vis som tabel</summary><div class="table-wrap"><table id="table-room-types"></table></div></details>
          </figure>
          <figure class="chart">
            <figcaption>Omsætning pr. land (rangliste)</figcaption>
            <div id="chart-countries"></div>
            <details class="data-table"><summary>Vis som tabel</summary><div class="table-wrap"><table id="table-countries"></table></div></details>
          </figure>
          <figure class="chart">
            <figcaption>Gæsteophold pr. land</figcaption>
            <p class="hint">Antal gæster på de valgte bookinger. Det er ikke unikke personer.</p>
            <div id="chart-guests"></div>
            <details class="data-table"><summary>Vis som tabel</summary><div class="table-wrap"><table id="table-guests"></table></div></details>
          </figure>
        </div>
      </section>

      <section class="panel" aria-labelledby="bar-title">
        <h2 id="bar-title">Cocktailbaren: <span id="bar-employee"></span></h2>
        <div id="bar-tiles" class="tiles"></div>
        <div class="charts">
          <figure class="chart">
            <figcaption>Fordeling mellem cocktails og kaffe</figcaption>
            <div id="category-legend" class="legend"></div>
            <div id="chart-categories"></div>
            <details class="data-table"><summary>Vis som tabel</summary><div class="table-wrap"><table id="table-categories"></table></div></details>
          </figure>
          <figure class="chart">
            <figcaption>Omsætning pr. drik</figcaption>
            <div id="drink-legend" class="legend"></div>
            <div id="chart-drinks"></div>
            <details class="data-table"><summary>Vis som tabel</summary><div class="table-wrap"><table id="table-drinks"></table></div></details>
          </figure>
        </div>
      </section>
    </div>
    <div id="chart-tooltip" class="chart-tooltip" role="status" hidden></div>
  </main>

  <script type="module" src="js/analytics.js"></script>
</body>
</html>
