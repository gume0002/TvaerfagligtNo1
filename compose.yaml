x-database-env: &database-env
  DATABASE_NAME: ${POSTGRES_DB:-hotel}
  DATABASE_USER: ${POSTGRES_USER:-hotel}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-hotel_demo_password}

x-postgres-image: &postgres-image postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1

x-postgres-healthcheck: &postgres-healthcheck
  # TCP only succeeds on the real server, not on the temporary one PostgreSQL
  # uses while it initializes the data directory.
  test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
  interval: 3s
  timeout: 5s
  retries: 40

x-backend-build: &backend-build
  context: ./backend
  target: runtime

services:
  db:
    image: *postgres-image
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel}
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_demo_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  init:
    build: *backend-build
    image: hotel-kong-arthur-backend
    command: ["python", "-m", "app.init"]
    environment:
      <<: *database-env
      DATABASE_HOST: db
      RAW_DATA_DIR: /data/raw
    volumes:
      - ./data/raw:/data/raw:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: *backend-build
    image: hotel-kong-arthur-backend
    environment:
      <<: *database-env
      DATABASE_HOST: db
      CORS_ORIGINS: http://localhost:8081
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui:v5.29.0@sha256:4fda0073bb5ab84b96ff5d94e3b602799c6935a07005e0fac9d7d3317b67ee20
    environment:
      SWAGGER_JSON: /contract/openapi.yaml
    volumes:
      - ./specs/004-hotelsystem/contracts/openapi.yaml:/contract/openapi.yaml:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      backend:
        condition: service_healthy

  test-db:
    profiles: [test]
    image: *postgres-image
    environment:
      POSTGRES_DB: hotel_test
      POSTGRES_USER: hotel_test
      POSTGRES_PASSWORD: hotel_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    networks: [test-net]

  test-backend:
    profiles: [test]
    build: *backend-build
    image: hotel-kong-arthur-backend
    environment:
      DATABASE_HOST: test-db
      DATABASE_NAME: hotel_test
      DATABASE_USER: hotel_test
      DATABASE_PASSWORD: hotel_test_password
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      test-net:
        aliases: [backend]

  test-frontend:
    profiles: [test]
    build: ./frontend
    depends_on:
      - test-backend
    networks: [test-net]

  test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    working_dir: /workspace
    command: ["pytest"]
    environment:
      DATABASE_HOST: test-db
      DATABASE_NAME: hotel_test
      DATABASE_USER: hotel_test
      DATABASE_PASSWORD: hotel_test_password
      RAW_DATA_DIR: /workspace/data/raw
      FRONTEND_URL: http://test-frontend
    volumes:
      - .:/workspace:ro
    depends_on:
      test-db:
        condition: service_healthy
      test-frontend:
        condition: service_started
    networks: [test-net]

volumes:
  postgres_data:

networks:
  test-net:
